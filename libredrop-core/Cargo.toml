[package]
name = "libredrop-core"
version = "1.0.0"
edition = "2021"
authors = ["LibreDrop Contributors", "Tobiasz (PolskieWin)"]
description = "Core high-performance P2P network, discovery, and file streaming engine for LibreDrop"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
bytes = "1.0"
futures-util = { version = "0.3", default-features = false }
