name: Build LibreDrop (Android, Linux & Windows)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android-linux:
    name: Build Android APKs & Linux CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Install Android NDK & Platforms
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Engine (cdylib for Android)
        run: |
          cd libredrop-engine
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Build Android APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Linux x86_64 CLI
        run: |
          cargo build --release -p libredrop-cli
          mkdir -p release-assets
          cp target/release/libredrop release-assets/libredrop-cli-linux-x86_64

      - name: Prepare APK Variants
        run: |
          mkdir -p release-assets
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            if [[ "$f" == *"universal"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-assets/LibreDrop-v1.0.0-universal.apk"
            elif [[ "$f" == *"arm64-v8a"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-assets/LibreDrop-v1.0.0-arm64-v8a.apk"
            elif [[ "$f" == *"armeabi-v7a"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-assets/LibreDrop-v1.0.0-armeabi-v7a.apk"
            elif [[ "$f" == *"x86_64"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-assets/LibreDrop-v1.0.0-x86_64.apk"
            else
              cp "$f" "${GITHUB_WORKSPACE}/release-assets/$f"
            fi
          done
          cd "${GITHUB_WORKSPACE}/release-assets"
          ls -lh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libredrop-v1.0.0-android-linux
          path: release-assets/*

  build-windows:
    name: Build Windows x86_64 Binary
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows Executable
        run: |
          cargo build --release -p libredrop-cli

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          $ReleaseDir = "release-windows"
          New-Item -ItemType Directory -Path $ReleaseDir -Force
          Copy-Item "target\release\libredrop.exe" "$ReleaseDir\"
          Copy-Item "run-libredrop-web.bat" "$ReleaseDir\"
          Copy-Item "run-libredrop-listen.bat" "$ReleaseDir\"
          Copy-Item "install-windows.ps1" "$ReleaseDir\"
          Copy-Item "README.md" "$ReleaseDir\"
          Compress-Archive -Path "$ReleaseDir\*" -DestinationPath "LibreDrop-v1.0.0-windows-x86_64.zip" -Force
          Get-Item "LibreDrop-v1.0.0-windows-x86_64.zip" | Select-Object Name, Length

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libredrop-windows-x86_64
          path: LibreDrop-v1.0.0-windows-x86_64.zip

      - name: Attach Windows Archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: LibreDrop-v1.0.0-windows-x86_64.zip
